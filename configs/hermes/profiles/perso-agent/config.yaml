    base_url: http://localhost:13306/v1
    model: Gemma-4-12B-it-GGUF
    models:
      Gemma-4-12B-it-GGUF: {}
      Gemma-4-31B-it-GGUF: {}
      Qwen3-Coder-30B-A3B-Instruct-GGUF: {}
      DeepSeek-Qwen3-8B-GGUF: {}
      Qwen3.6-27B-GGUF: {}
